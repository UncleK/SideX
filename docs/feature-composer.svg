<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <defs>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .bold { font-weight: 700; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
    </style>
    <linearGradient id="thumb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="440" rx="16" fill="#000000" stroke="#2f3336" stroke-width="1" />

  <!-- Header Banner -->
  <rect width="760" height="52" fill="#16181c" rx="16" />
  <rect y="36" width="760" height="16" fill="#16181c" />
  <line x1="0" y1="52" x2="760" y2="52" stroke="#2f3336" stroke-width="1" />
  
  <text x="24" y="32" fill="#e7e9ea" font-size="16" class="text bold">行内就地回复与剪贴板贴图 / Inline Composer &amp; Image Paste</text>
  <rect x="610" y="14" width="125" height="24" rx="12" fill="#00ba7c" fill-opacity="0.15" />
  <text x="672" y="30" fill="#00ba7c" font-size="12" class="text bold" text-anchor="middle">Ctrl+V Paste</text>

  <!-- Target Comment Being Replied To -->
  <g transform="translate(24, 75)">
    <circle cx="20" cy="20" r="20" fill="#0284c7" />
    <text x="20" y="26" fill="#ffffff" font-size="14" class="text bold" text-anchor="middle">A</text>
    
    <text x="56" y="16" fill="#e7e9ea" font-size="15" class="text bold">Alex Rivera</text>
    <text x="145" y="16" fill="#71767b" font-size="13" class="text regular">@arivera_design · 2h</text>
    
    <text x="56" y="40" fill="#e7e9ea" font-size="14" class="text regular">
      粘贴剪贴板图片直接上传回复这个细节太赞了，发 Meme 图简直秒发。
    </text>

    <!-- The Real Inline Accordion Composer Container (.sidepeek-inline-composer.expanded) -->
    <g transform="translate(56, 64)">
      <!-- Composer Outer Box -->
      <rect width="656" height="230" rx="12" fill="#16181c" stroke="#2f3336" stroke-width="1.5" />

      <!-- Textarea content -->
      <text x="16" y="30" fill="#e7e9ea" font-size="14" class="text regular">
        <tspan x="16" dy="0">支持任意格式图片直接 Ctrl+V 粘贴！</tspan>
        <tspan x="16" dy="24">会自动调用 X 官方三段式媒体上传接口（INIT / APPEND / FINALIZE），原图秒发 🚀</tspan>
      </text>

      <!-- Pasted Image Preview Card (.sidepeek-pasted-preview) -->
      <g transform="translate(16, 75)">
        <rect width="72" height="72" rx="8" fill="url(#thumb-grad)" stroke="#2f3336" stroke-width="1" />
        <text x="36" y="44" fill="#ffffff" font-size="24" text-anchor="middle">📸</text>
        
        <!-- Remove Button (✕) -->
        <circle cx="64" cy="8" r="9" fill="#000000" fill-opacity="0.8" stroke="#ffffff" stroke-width="0.5" />
        <text x="64" y="11.5" fill="#ffffff" font-size="9" class="text bold" text-anchor="middle">✕</text>
        
        <text x="86" y="40" fill="#71767b" font-size="12" class="text regular">screenshot_2026.png</text>
        <text x="86" y="58" fill="#00ba7c" font-size="11" class="text medium">✓ 已就绪 (Ready)</text>
      </g>

      <!-- Footer Action Area (.sidepeek-composer-footer) -->
      <line x1="0" y1="170" x2="656" y2="170" stroke="#2f3336" stroke-width="1" />
      
      <!-- Key Hint -->
      <g transform="translate(16, 202)">
        <rect x="0" y="-14" width="86" height="20" rx="4" fill="#2f3336" />
        <text x="43" y="0" fill="#e7e9ea" font-size="11" class="text bold" text-anchor="middle">Ctrl + Enter</text>
        <text x="96" y="0" fill="#71767b" font-size="12" class="text regular">快速发送</text>
      </g>

      <!-- Cancel & Submit Buttons -->
      <g transform="translate(530, 185)">
        <text x="16" y="18" fill="#71767b" font-size="13" class="text medium" cursor="pointer">取消</text>
        
        <rect x="56" y="0" width="62" height="32" rx="16" fill="#1d9bf0" />
        <text x="87" y="21" fill="#ffffff" font-size="13" class="text bold" text-anchor="middle">发送</text>
      </g>
    </g>
  </g>
</svg>
