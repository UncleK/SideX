<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 800px;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Chrome Browser Header Bar (46px) */
  .browser-header {
    height: 46px;
    background: #f1f3f4;
    border-bottom: 1px solid #dadce0;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    user-select: none;
    flex-shrink: 0;
  }
  .window-dots {
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
  .dot-red { background: #ff5f56; }
  .dot-yellow { background: #ffbd2e; }
  .dot-green { background: #27c93f; }

  .browser-nav {
    display: flex;
    gap: 12px;
    color: #5f6368;
    font-size: 15px;
  }

  .url-bar {
    flex: 1;
    height: 30px;
    background: #ffffff;
    border: 1px solid #dadce0;
    border-radius: 16px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 8px;
    font-size: 13px;
    color: #202124;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }
  .url-lock {
    color: #1a73e8;
    font-size: 12px;
  }
  .url-text {
    font-weight: 500;
  }
  .url-protocol {
    color: #70757a;
  }

  .browser-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sidex-pinned-ext {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px;
    background: rgba(29, 155, 240, 0.12);
    border: 1px solid rgba(29, 155, 240, 0.35);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    color: #1d9bf0;
  }
  .sidex-pinned-ext img {
    width: 18px;
    height: 18px;
  }

  /* Page Content Area */
  .page-viewport {
    flex: 1;
    width: 1280px;
    height: 754px;
    background: #ffffff;
    position: relative;
    overflow: hidden;
  }
  .page-viewport img.main-frame {
    width: 1280px;
    height: auto;
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }

  /* SideX Highlight Callout Pill */
  .callout-badge {
    position: absolute;
    top: 14px;
    right: 24px;
    background: rgba(15, 20, 25, 0.9);
    border: 1px solid rgba(29, 155, 240, 0.6);
    border-radius: 999px;
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    z-index: 10;
  }
  .callout-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00d2ff;
    box-shadow: 0 0 8px #00d2ff;
  }
</style>
</head>
<body>
  <!-- Chrome Top Bar -->
  <div class="browser-header">
    <div class="window-dots">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
    </div>
    <div class="browser-nav">
      <span>‹</span>
      <span>›</span>
      <span>↻</span>
    </div>
    <div class="url-bar">
      <span class="url-lock">🔒</span>
      <span class="url-protocol">https://</span><span class="url-text">x.com/home</span>
    </div>
    <div class="browser-actions">
      <div class="sidex-pinned-ext">
        <img src="../icons/icon-32.png" alt="SideX" />
        <span>SideX Active</span>
      </div>
    </div>
  </div>

  <!-- Viewport -->
  <div class="page-viewport">
    <img src="../demo/frame_4.png" class="main-frame" alt="SideX Stream Screenshot" />
    <div class="callout-badge">
      <span class="callout-dot"></span>
      <span>SideX · Docked In-Place Comment Stream</span>
    </div>
  </div>
</body>
</html>
