        <circle cx="20" cy="20" r="20" fill="#0284c7" />
        <text x="20" y="26" fill="#ffffff" font-size="14" class="txt bold" text-anchor="middle">AR</text>

        <!-- Author Header -->
        <text x="52" y="16" fill="#e7e9ea" font-size="15" class="txt bold">Alex Rivera</text>
        <!-- Official X Verified Checkmark Badge -->
        <path d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.67-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.67-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z" fill="#1d9bf0" transform="translate(142, 2) scale(0.75)" />
        <text x="168" y="16" fill="#71767b" font-size="14" class="txt reg">@arivera_design · 2h</text>

        <!-- Expanded Tweet Text -->
