            <path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.249c-4.42 0-8.001-3.58-8.001-8zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.32 2.688 6 6.005 6h2.249v2.22l4.981-2.76c1.947-1.08 3.16-3.13 3.16-5.33 0-3.39-2.744-6.13-6.129-6.13H9.756z" fill="#71767b" transform="scale(0.8) translate(0, -14)" />
            <text x="22" y="0">86</text>
          </g>
          <!-- Repost -->
