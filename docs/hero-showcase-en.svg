    </g>

    <!-- Thread Group 1 (.sidepeek-thread-group) -->
    <g transform="translate(16, 68)">
      <!-- Parent Comment (.sidepeek-comment-item) -->
      <circle cx="18" cy="18" r="18" fill="#e11d48" />
      <text x="18" y="23" fill="#ffffff" font-size="12" class="txt bold" text-anchor="middle">E</text>
      
      <!-- REAL Thread Line (.sidepeek-thread-line) -->
      <line x1="18" y1="42" x2="18" y2="300" stroke="#2f3336" stroke-width="2" />

      <!-- Parent Header -->
      <text x="46" y="15" fill="#e7e9ea" font-size="14" class="txt bold">Elena Rostova</text>
      <path d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.67-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.67-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z" fill="#1d9bf0" transform="translate(142, 2) scale(0.65)" />
      <text x="164" y="15" fill="#71767b" font-size="13" class="txt reg">@elena_ux · 1h</text>

      <!-- Comment Text -->
      <text x="46" y="38" fill="#e7e9ea" font-size="13.5" class="txt reg">
        <tspan x="46" dy="0">The in-place docked drawer feels so natural! Finally no more full-page redirects.</tspan>
        <tspan x="46" dy="20">Does it support conversation trees and nested sub-thread drill-down?</tspan>
      </text>

      <!-- Actions -->
      <g transform="translate(46, 85)" fill="#71767b" font-size="12" class="txt reg">
        <text x="0" y="0">💬 3</text>
        <text x="60" y="0">🔁 1</text>
        <text x="120" y="0" fill="#f91880">❤️ 42</text>
        <text x="180" y="0">🔖</text>
        <text x="240" y="0">↗️</text>
      </g>

      <!-- REAL INLINE ACCORDION COMPOSER (.sidepeek-inline-composer.expanded) -->
      <g transform="translate(46, 102)">
        <rect width="342" height="154" rx="12" fill="#16181c" stroke="#2f3336" stroke-width="1" />
        
        <!-- Textarea -->
        <text x="14" y="26" fill="#e7e9ea" font-size="13" class="txt reg">Absolutely! Reconstructs full nested hierarchies with dedicated branch drill-down 👇</text>

        <!-- Pasted Image Preview (.sidepeek-pasted-preview) -->
        <g transform="translate(14, 46)">
          <rect width="52" height="52" rx="6" fill="#1e293b" stroke="#2f3336" stroke-width="1" />
          <text x="26" y="32" font-size="18" text-anchor="middle">🎨</text>
          <!-- Delete badge -->
          <circle cx="46" cy="6" r="7" fill="#000000" fill-opacity="0.8" />
          <text x="46" y="9" fill="#ffffff" font-size="8" class="txt bold" text-anchor="middle">✕</text>
        </g>

        <!-- Composer Footer -->
        <line x1="0" y1="110" x2="342" y2="110" stroke="#2f3336" stroke-width="1" />
        <text x="14" y="134" fill="#71767b" font-size="11.5" class="txt reg">Press Ctrl+Enter to send</text>
        
        <text x="236" y="134" fill="#71767b" font-size="13" class="txt med">Cancel</text>
        <rect x="274" y="118" width="56" height="28" rx="14" fill="#1d9bf0" />
        <text x="302" y="136" fill="#ffffff" font-size="13" class="txt bold" text-anchor="middle">Reply</text>
      </g>

      <!-- Child Comment (Indented with reply-to tag) -->
      <g transform="translate(0, 276)">
        <circle cx="18" cy="18" r="16" fill="#0284c7" />
        <text x="18" y="23" fill="#ffffff" font-size="11" class="txt bold" text-anchor="middle">AR</text>

        <text x="46" y="14" fill="#e7e9ea" font-size="14" class="txt bold">Alex Rivera</text>
        <path d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.67-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.67-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z" fill="#1d9bf0" transform="translate(132, 2) scale(0.6)" />
        <text x="152" y="14" fill="#71767b" font-size="12" class="txt reg">@arivera_design · 45m</text>
        
        <!-- Reply-to tag -->
        <text x="46" y="32" fill="#1d9bf0" font-size="12" class="txt reg">Replying to @elena_ux</text>

        <text x="46" y="52" fill="#e7e9ea" font-size="13.5" class="txt reg">
          <tspan x="46" dy="0">Displays top 2 nested replies inline, click below</tspan>
          <tspan x="46" dy="20">to drill into an isolated thread branch view!</tspan>
        </text>

        <!-- Drill-down Trigger (.sidepeek-drilldown-trigger) -->
        <text x="46" y="98" fill="#1d9bf0" font-size="13" class="txt med" cursor="pointer">↳ Show 2 more replies (Drill-down)</text>
      </g>
    </g>

    <!-- Divider between thread groups -->
    <line x1="0" y1="495" x2="420" y2="495" stroke="#2f3336" stroke-width="1" />

    <!-- Thread Group 2: Standalone Comment -->
