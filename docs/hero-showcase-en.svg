          <tspan x="52" dy="0">Excited to introduce SideX - an immersive in-place comment drawer for X!</tspan>
          <tspan x="52" dy="24">Click any tweet to dock comments directly into the 3rd column without leaving your timeline.</tspan>
          <tspan x="52" dy="24">Supports full conversation trees, sub-thread drill-down, and inline clipboard pasting 🚀</tspan>
        </text>

        <!-- Card Embed -->
        <rect x="52" y="125" width="480" height="100" rx="12" fill="#16181c" stroke="#2f3336" stroke-width="1" />
        <rect x="64" y="137" width="76" height="76" rx="8" fill="#1e293b" />
        <text x="102" y="182" fill="#38bdf8" font-size="28" text-anchor="middle">⚡</text>
        <text x="156" y="168" fill="#e7e9ea" font-size="15" class="txt bold">SideX - In-Place Comment Stream</text>
        <text x="156" y="192" fill="#71767b" font-size="13" class="txt reg">github.com/UncleK/SideX · Manifest V3</text>

