<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <defs>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .bold { font-weight: 700; }
      .medium { font-weight: 500; }
      .regular { font-weight: 400; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="760" height="480" rx="16" fill="#000000" stroke="#2f3336" stroke-width="1" />

  <!-- Header Banner -->
  <rect width="760" height="52" fill="#16181c" rx="16" />
  <rect y="36" width="760" height="16" fill="#16181c" />
  <line x1="0" y1="52" x2="760" y2="52" stroke="#2f3336" stroke-width="1" />
  
  <text x="24" y="32" fill="#e7e9ea" font-size="16" class="text bold">树状对话流与层级下钻 / Conversation Tree &amp; Drill-down</text>
  <rect x="630" y="14" width="105" height="24" rx="12" fill="#1d9bf0" fill-opacity="0.15" />
  <text x="682" y="30" fill="#1d9bf0" font-size="12" class="text bold" text-anchor="middle">SideX Core</text>

  <!-- Thread Content Container -->
  <g transform="translate(24, 75)">
    <!-- 1. Parent Comment -->
    <circle cx="20" cy="20" r="20" fill="#e11d48" />
    <text x="20" y="26" fill="#ffffff" font-size="14" class="text bold" text-anchor="middle">E</text>

    <!-- Continuous Thread Line -->
    <line x1="20" y1="46" x2="20" y2="290" stroke="#38444d" stroke-width="3" />

    <!-- Parent Details -->
    <g transform="translate(56, 0)">
      <text x="0" y="16" fill="#e7e9ea" font-size="15" class="text bold">Elena Rostova</text>
      <circle cx="110" cy="11" r="6" fill="#1d9bf0" />
      <text x="110" y="14" fill="#ffffff" font-size="8" class="text bold" text-anchor="middle">✓</text>
      <text x="124" y="16" fill="#71767b" font-size="13" class="text regular">@elena_ux · 1小时前</text>

      <text x="0" y="42" fill="#e7e9ea" font-size="14" class="text regular">
        <tspan x="0" dy="0">这个侧边停靠的交互太舒服了！原地看长推文+评论终于不需要开一堆新标签页了。</tspan>
        <tspan x="0" dy="22">请问完整支持树状层级和多级子回复的就地下钻吗？</tspan>
      </text>

      <!-- Action Counts -->
      <g transform="translate(0, 80)" fill="#71767b" font-size="12" class="text regular">
        <text x="0" y="0">💬 3 回复</text>
        <text x="80" y="0">🔁 2 转推</text>
        <text x="160" y="0" fill="#f91880">❤️ 42 喜欢</text>
        <text x="250" y="0">🔖 书签</text>
      </g>
    </g>

    <!-- 2. Nested Child Comment 1 (Indented & Connected) -->
    <g transform="translate(0, 130)">
      <circle cx="20" cy="20" r="18" fill="#0284c7" />
      <text x="20" y="25" fill="#ffffff" font-size="12" class="text bold" text-anchor="middle">A</text>

      <g transform="translate(56, 0)">
        <text x="0" y="16" fill="#e7e9ea" font-size="15" class="text bold">Alex Rivera</text>
        <circle cx="95" cy="11" r="6" fill="#1d9bf0" />
        <text x="95" y="14" fill="#ffffff" font-size="8" class="text bold" text-anchor="middle">✓</text>
        <text x="110" y="16" fill="#71767b" font-size="13" class="text regular">@arivera_design · 45分前</text>
        
        <text x="0" y="34" fill="#1d9bf0" font-size="12.5" class="text regular">回复 @elena_ux</text>
        
        <text x="0" y="56" fill="#e7e9ea" font-size="14" class="text regular">
          <tspan x="0" dy="0">完全支持！默认展示前 2 条二级子回复，更多回复可以点击下方</tspan>
          <tspan x="0" dy="22">“展开另外 N 条回复”直接下钻进入专注于该子分支的独立视窗！</tspan>
        </text>

        <g transform="translate(0, 94)" fill="#71767b" font-size="12" class="text regular">
          <text x="0" y="0">💬 回复</text>
          <text x="70" y="0" fill="#f91880">❤️ 18 喜欢</text>
        </g>
      </g>
    </g>

    <!-- 3. Drill-down Trigger Button (Interactive State) -->
    <g transform="translate(56, 275)">
      <rect width="210" height="34" rx="17" fill="#1d9bf0" fill-opacity="0.1" stroke="#1d9bf0" stroke-width="1" stroke-opacity="0.3" />
      <text x="18" y="22" fill="#1d9bf0" font-size="13" class="text medium">↳ 展开另外 3 条回复 (下钻)</text>
    </g>

    <!-- 4. Subtree Indication Bracket -->
    <path d="M720 180 C 740 180, 740 230, 755 230 C 740 230, 740 280, 720 280" fill="none" stroke="#1d9bf0" stroke-width="2" stroke-dasharray="4,4" />
    <text x="710" y="235" fill="#1d9bf0" font-size="12" class="text bold" text-anchor="end">Sub-thread Branch</text>
  </g>
</svg>
