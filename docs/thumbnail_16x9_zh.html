<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 720px;
    background: #06090e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f7f9f9;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 70px;
  }

  /* Cyber Radial Glows */
  .bg-glow-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1100px;
    height: 600px;
    background: radial-gradient(ellipse at center, rgba(29, 155, 240, 0.25) 0%, rgba(0, 210, 255, 0.09) 45%, transparent 72%);
    pointer-events: none;
    z-index: 0;
  }
  .bg-glow-top {
    position: absolute;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 360px;
    background: radial-gradient(ellipse, rgba(0, 180, 248, 0.22) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px),
      linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 32px 32px, 64px 64px, 64px 64px;
    opacity: 0.65;
    pointer-events: none;
    z-index: 0;
  }

  /* Main Container */
  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 26px;
    width: 100%;
    max-width: 1180px;
  }

  /* Brand Header */
  .brand-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }
  .brand-logo-wrap {
    width: 92px;
    height: 92px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 0 36px rgba(0, 210, 255, 0.75));
  }
  .brand-logo-wrap img {
    width: 92px;
    height: 92px;
    display: block;
  }

  .brand-text-col {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .brand-title-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand-title {
    font-size: 68px;
    font-weight: 900;
    letter-spacing: -1.5px;
    background: linear-gradient(135deg, #ffffff 0%, #e2f1ff 45%, #1d9bf0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 28px rgba(29, 155, 240, 0.45);
    line-height: 1;
  }
  .badge-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .version-badge {
    padding: 4px 14px;
    background: rgba(29, 155, 240, 0.22);
    border: 1px solid rgba(29, 155, 240, 0.6);
    border-radius: 999px;
    color: #00d2ff;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .pill-badge {
    padding: 4px 14px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    color: #9ba7b4;
    font-size: 13px;
    font-weight: 600;
  }

  /* Taglines */
  .tagline-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .tagline-main {
    font-size: 42px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -0.6px;
    line-height: 1.25;
  }
  .tagline-glow {
    background: linear-gradient(90deg, #00f0ff 0%, #1d9bf0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tagline-sub {
    font-size: 20px;
    color: #8b98a5;
    font-weight: 500;
    letter-spacing: 0.2px;
  }

  /* 2 x 2 Feature Grid (Large Text, High Contrast) */
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    width: 100%;
    margin-top: 6px;
  }
  .feature-card {
    background: rgba(14, 21, 32, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    padding: 22px 26px;
    backdrop-filter: blur(16px);
    display: flex;
    align-items: flex-start;
    text-align: left;
    gap: 18px;
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
    position: relative;
    overflow: hidden;
  }
  .feature-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(29, 155, 240, 0.75), transparent);
  }
  .feature-icon-box {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: rgba(29, 155, 240, 0.2);
    border: 1px solid rgba(29, 155, 240, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(29, 155, 240, 0.25);
  }
  .feature-text-col {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .feature-title {
    font-size: 21px;
    font-weight: 800;
    color: #f7f9f9;
    letter-spacing: -0.2px;
  }
  .feature-desc {
    font-size: 15px;
    color: #8b98a5;
    line-height: 1.55;
  }
</style>
</head>
<body>
  <div class="bg-glow-center"></div>
  <div class="bg-glow-top"></div>
  <div class="bg-grid"></div>

  <div class="container">
    <!-- Brand Header -->
    <div class="brand-row">
      <div class="brand-logo-wrap">
        <img src="../icons/icon-128.png" alt="SideX Logo" />
      </div>
      <div class="brand-text-col">
        <div class="brand-title-row">
          <h1 class="brand-title">SideX</h1>
          <span class="version-badge">v1.1.2</span>
        </div>
        <div class="badge-row">
          <span class="pill-badge">𝕏 (Twitter) 效率神器</span>
          <span class="pill-badge">100% 会话安全</span>
          <span class="pill-badge">开源免费</span>
        </div>
      </div>
    </div>

    <!-- Taglines -->
    <div class="tagline-group">
      <div class="tagline-main">
        沉浸式侧边评论流 · <span class="tagline-glow">零跳转刷推体验</span>
      </div>
      <div class="tagline-sub">
        就地出流看评论，原位自动展开长文，无需跳转即可边刷边回
      </div>
    </div>

    <!-- 2x2 Feature Grid -->
    <div class="feature-grid">
      <div class="feature-card">
        <div class="feature-icon-box">⚡</div>
        <div class="feature-text-col">
          <div class="feature-title">零跳转就地停靠</div>
          <div class="feature-desc">点击推文右侧就地出流，告别在信息流与详情页间反复跳转与刷新</div>
        </div>
      </div>

      <div class="feature-card">
        <div class="feature-icon-box">📖</div>
        <div class="feature-text-col">
          <div class="feature-title">长文与转帖秒展开</div>
          <div class="feature-desc">原位秒级展开“显示更多”长推文，𝕏 Article 官方专栏顺畅原生跳转</div>
        </div>
      </div>

      <div class="feature-card">
        <div class="feature-icon-box">💬</div>
        <div class="feature-text-col">
          <div class="feature-title">常驻行内快捷回复</div>
          <div class="feature-desc">底部常驻快捷回复栏，支持 Ctrl+V 粘贴剪贴板图片、GIF 动图与表情包</div>
        </div>
      </div>

      <div class="feature-card">
        <div class="feature-icon-box">🛡️</div>
        <div class="feature-text-col">
          <div class="feature-title">原生会话 100% 安全</div>
          <div class="feature-desc">直接复用浏览器官方登录态与 Session，零额外权限申请，零封号风险</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
