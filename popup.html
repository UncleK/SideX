<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SideX</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="sidex-popup">
    <!-- Header -->
    <header class="sidex-popup-header">
      <div class="sidex-popup-brand">
        <img src="icons/icon-32.png" alt="SideX Logo" class="sidex-popup-logo" />
        <div class="sidex-popup-title-group">
          <span class="sidex-popup-title">SideX</span>
          <span class="sidex-popup-badge" id="sidex-version-badge">v1.1.34</span>
        </div>
      </div>
      <!-- Language Switcher in Header -->
      <div class="sidex-lang-group" id="sidex-lang-group">
        <button type="button" class="sidex-lang-btn" data-lang="zh">中</button>
        <button type="button" class="sidex-lang-btn" data-lang="en">EN</button>
      </div>
    </header>

    <p class="sidex-refresh-notice" role="status" hidden><span id="txt-refresh-notice">请刷新 X 生效</span></p>

    <!-- Extension Toggle -->
    <div class="sidex-card sidex-switch-card">
      <div class="sidex-switch-main-row">
        <div class="sidex-switch-info">
          <div class="sidex-switch-title" id="txt-switch-title">插件状态</div>
          <div class="sidex-switch-desc" id="txt-switch-desc">点击推文原地展开评论流</div>
        </div>
        <label class="sidex-toggle">
          <input type="checkbox" id="sidex-toggle-input" checked />
          <span class="sidex-toggle-slider"></span>
        </label>
      </div>

    </div>

    <!-- Reply Display Settings -->
    <div class="sidex-card sidex-reply-settings-card">
      <h2 class="sidex-section-title" id="txt-reading-title">评论阅读</h2>
      <div class="sidex-action-row">
        <div class="sidex-action-label" id="txt-subreply-limit-label">默认展开回复数</div>
        <div class="sidex-pill-group" id="sidex-limit-group" role="group" aria-labelledby="txt-subreply-limit-label" aria-describedby="txt-subreply-limit-hint">
          <button type="button" class="sidex-pill-btn active" data-limit="1">1</button>
          <button type="button" class="sidex-pill-btn" data-limit="2">2</button>
          <button type="button" class="sidex-pill-btn" data-limit="3">3</button>
          <button type="button" class="sidex-pill-btn" data-limit="5">5</button>
        </div>
      </div>
      <p class="sidex-setting-hint" id="txt-subreply-limit-hint"></p>
      <div class="sidex-card-divider"></div>
      <div class="sidex-switch-setting-row">
        <div class="sidex-switch-info">
          <label class="sidex-switch-title" id="txt-auto-load-title" for="sidex-auto-load-input">滚动到底继续加载评论</label>
          <div class="sidex-switch-desc" id="txt-auto-load-desc">靠近底部时加载下一页一级评论；手动加载后暂停。</div>
        </div>
        <label class="sidex-toggle">
          <input type="checkbox" id="sidex-auto-load-input" checked aria-labelledby="txt-auto-load-title" aria-describedby="txt-auto-load-desc" />
          <span class="sidex-toggle-slider"></span>
        </label>
      </div>
      <div class="sidex-card-divider"></div>
      <div class="sidex-switch-setting-row">
        <div class="sidex-switch-info">
          <label class="sidex-switch-title" id="txt-auto-expand-title" for="sidex-auto-expand-text">完整显示回复长文</label>
          <div class="sidex-switch-desc" id="txt-auto-expand-desc">侧栏长回复直接显示全文，无需点“显示更多”。</div>
        </div>
        <label class="sidex-toggle">
          <input type="checkbox" id="sidex-auto-expand-text" checked aria-labelledby="txt-auto-expand-title" aria-describedby="txt-auto-expand-desc" />
          <span class="sidex-toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Features / Quick Actions -->
    <details class="sidex-card sidex-more-settings">
      <summary>
        <span class="sidex-section-title" id="txt-more-settings-title">更多设置</span>
        <span class="sidex-setting-hint" id="txt-more-settings-hint">回复方式、图片、翻译与侧栏</span>
      </summary>
      <div class="sidex-actions-card">
      <div class="sidex-action-row">
        <div class="sidex-action-label" id="txt-reply-mode-label">回复模式</div>
        <div class="sidex-pill-group" id="sidex-reply-mode-group">
          <button type="button" class="sidex-pill-btn active" data-mode="drawer" id="btn-mode-drawer">快捷回复</button>
          <button type="button" class="sidex-pill-btn" data-mode="native" id="btn-mode-native">官方弹窗</button>
        </div>
      </div>
      <p class="sidex-setting-hint" id="txt-reply-mode-hint"></p>
      <div class="sidex-card-divider"></div>
      <div class="sidex-action-row">
        <div class="sidex-action-label" id="txt-photo-mode-label">图片评论区</div>
        <div class="sidex-pill-group" id="sidex-photo-mode-group">
          <button type="button" class="sidex-pill-btn active" data-photo-mode="sidex" id="btn-photo-sidex">SideX 样式</button>
          <button type="button" class="sidex-pill-btn" data-photo-mode="native" id="btn-photo-native">官方样式</button>
        </div>
      </div>
      <p class="sidex-setting-hint" id="txt-photo-mode-hint"></p>
      <div class="sidex-card-divider"></div>
      <div class="sidex-action-row">
        <label class="sidex-action-label" id="txt-translation-label" for="sidex-translation-provider">翻译方式</label>
        <select id="sidex-translation-provider" class="sidex-select">
          <option value="x">X 官方</option>
          <option value="google">Google</option>
          <option value="external">已有翻译插件</option>
        </select>
      </div>
      <p class="sidex-setting-hint" id="txt-translation-hint"></p>
      <div class="sidex-card-divider"></div>
      <div class="sidex-switch-setting-row">
        <div class="sidex-switch-info">
          <label class="sidex-switch-title" id="txt-auto-pin-label" for="sidex-auto-pin">侧栏默认保持打开</label>
          <div class="sidex-switch-desc" id="txt-auto-pin-hint">新侧栏默认固定，点击页面空白或按 Esc 不会关闭。</div>
        </div>
        <label class="sidex-toggle">
          <input type="checkbox" id="sidex-auto-pin" aria-labelledby="txt-auto-pin-label" aria-describedby="txt-auto-pin-hint" />
          <span class="sidex-toggle-slider"></span>
        </label>
      </div>
      <div class="sidex-card-divider"></div>
      <div class="sidex-action-row">
        <div class="sidex-action-label" id="txt-reset-label">默认设置</div>
        <button type="button" class="sidex-action-btn" id="btn-reset-defaults">
          <svg viewBox="0 0 256 256" width="14" height="14" fill="currentColor">
            <path d="M224,128a96,96,0,1,1-21.84-60.61L224,48v48H176l18.53-18.53A80,80,0,1,0,207.82,136H224A95.54,95.54,0,0,1,224,128Z"/>
          </svg>
          <span id="txt-reset-btn">全部恢复</span>
        </button>
      </div>
      <p class="sidex-setting-hint" id="txt-reset-hint">恢复所有选项和侧栏宽度，语言跟随浏览器；保留回复草稿。</p>
      </div>
    </details>

    <!-- Shortcut Hints & Footer -->
    <footer class="sidex-popup-footer">
      <div class="sidex-hint-row">
        <span class="sidex-hint-key">Esc</span>
        <span class="sidex-hint-text" id="txt-hint-esc">关闭抽屉或大图</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
